[package]
name = "hockey-stats"
version = "1.1.1"
edition = "2024"

[dependencies]
minisign-verify = "0.3.0"
nalgebra = "0.35.0"
pdf-extract = "0.12.1"
rand = "0.10.3"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
statrs = "0.19.1"
thiserror = "2.0.21"
tiny_http = "0.12.0"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
suboptimal_flops = "allow"
